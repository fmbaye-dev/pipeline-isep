name: Mon premier pipeline

on:
  push:
  workflow_dispatch:

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: Dire bonjour
        run: echo "Bonjour ISEP Diamniadio !"

      - name: Presenter la machine
        run:  |
          whoami
          uname -a
          date
      - name: lister les fichiers avant
        run: ls -la

      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Lire un fichier
        run: cat README.md

      - name: lister les fichiers apres
        run: ls -la
